apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-api
  labels:
    app: sre-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-demo-api
  template:
    metadata:
      labels:
        app: sre-demo-api
    spec:
      containers:
        - name: api
          image: ACR_LOGIN_SERVER/sre-demo-api:latest # zameni sa output-om iz terraforma
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: sre-demo-api
spec:
  selector:
    app: sre-demo-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sre-demo-api
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sre-demo-api
                port:
                  number: 80
